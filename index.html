<style>
:root{color-scheme:light dark;--bg:#f4f4f1;--card:#fff;--ink:#1d1d1b;--mut:#6b6b66;--br:#cb4727;--ring:#dcdcd6}

button:disabled{opacity:.6}.e{color:#c0392b;font-size:13px;min-height:18px;margin-top:8px}.m{font-size:12px;color:var(--mut);margin-top:14px}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unwrap(pw,users){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  for(const u of (users||D.users)){
    const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(u.salt),iterations:D.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    try{const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(u.iv)},kek,b64(u.wrapped));
        return await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);}catch(_){}
  }
  throw new Error('no');
}
async function unz(key,iv,ct){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(iv)},key,b64(ct));
  const ds=new DecompressionStream('deflate-raw');const w=ds.writable.getWriter();w.write(new Uint8Array(pt));w.close();
  return await new Response(ds.readable).text();
}

function sw(id,label,view){return '<script>(function(){var a=document.getElementById('+JSON.stringify(id)+');if(!a){a=document.createElement("a");a.style.cssText="position:fixed;right:10px;bottom:10px;z-index:99;padding:8px 14px;border-radius:999px;background:#cb4727;color:#fff;font:600 13px system-ui;text-decoration:none";document.body.appendChild(a)}a.style.display="";a.textContent='+JSON.stringify(label)+';a.href="#";a.onclick=function(e){e.preventDefault();try{sessionStorage.setItem("mt_view",'+JSON.stringify(view)+')}catch(_){}history.replaceState(null,"",location.pathname+location.search);location.reload()}})()<\/script>'}
async function open(pw){
  const key=await unwrap(pw);
  let html=await unz(key,D.iv,D.ct);
  if(D.extra){let k2=null;try{k2=await unwrap(pw,D.extra.users)}catch(_){}
    if(k2){let v='main';try{v=sessionStorage.getItem('mt_view')||'main'}catch(_){}
      if(v==='extra')html=(await unz(k2,D.extra.iv,D.extra.ct))+sw(D.extra.back_id,D.extra.back_label,'main');
      else html+=sw(D.extra.btn_id,D.extra.label,'extra');}}
  try{sessionStorage.setItem('mt_pw',pw)}catch(_){}
  document.open();document.write(html);document.close();
}
