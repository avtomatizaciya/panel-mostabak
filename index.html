<style>
:root{color-scheme:light dark;--bg:#f4f4f1;--card:#fff;--ink:#1d1d1b;--mut:#6b6b66;--br:#cb4727;--ring:#dcdcd6}

button:disabled{opacity:.6}.e{color:#c0392b;font-size:13px;min-height:18px;margin-top:8px}.m{font-size:12px;color:var(--mut);margin-top:14px}
